# Generated by Noctalia's Template Processor. Do not edit manually.
# 源模板：dotfiles/noctalia/templates/fcitx5-theme.conf
# vim: ft=dosini
[Metadata]
Name=Noctalia
Version=1.0
Author=Noctalia Template
Description=Follows the current Noctalia color scheme
ScaleWithDPI=True

[InputPanel]
Font=Sans 13
Spacing=3

# 未选中候选文字颜色
NormalColor={{colors.on_surface.default.hex}}
# 选中候选文字颜色（位于 primary 高亮条之上）
HighlightCandidateColor={{colors.on_primary.default.hex}}
# 预编辑文本（输入中的拼音）颜色
HighlightColor={{colors.primary.default.hex}}
# 预编辑文本背景色
HighlightBackgroundColor={{colors.surface_container_high.default.hex}}

[InputPanel/TextMargin]
Left=12
Right=12
Top=8
Bottom=8

[InputPanel/Background]
Color={{colors.surface_container.default.hex}}
BorderColor={{colors.outline.default.hex}}
BorderWidth=1

[InputPanel/Background/Margin]
Left=10
Right=10
Top=10
Bottom=10

[InputPanel/Highlight]
Color={{colors.primary.default.hex}}

[InputPanel/Highlight/Margin]
Left=12
Right=12
Top=8
Bottom=8

[Menu]
Font=Sans 10
NormalColor={{colors.on_surface.default.hex}}
Spacing=3

[Menu/Background]
Color={{colors.surface_container.default.hex}}
BorderColor={{colors.outline.default.hex}}
BorderWidth=1

[Menu/Background/Margin]
Left=2
Right=2
Top=2
Bottom=2

[Menu/ContentMargin]
Left=2
Right=2
Top=2
Bottom=2

[Menu/Highlight]
Color={{colors.primary.default.hex}}

[Menu/Highlight/Margin]
Left=10
Right=10
Top=5
Bottom=5

[Menu/Separator]
Color={{colors.outline_variant.default.hex}}

[Menu/TextMargin]
Left=5
Right=5
Top=5
Bottom=5
