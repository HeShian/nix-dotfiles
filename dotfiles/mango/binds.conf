# Mango 快捷键：对齐 Niri 的日常操作，同时保留固定 tag 与动态工作区的语义差异。

# 特殊功能
bind=SUPER+SHIFT,slash,spawn_shell,~/.config/mango/scripts/mango-binds
bind=SUPER,F1,spawn_shell,env -u GTK_IM_MODULE fcitx5 -r
bind=SUPER,F2,spawn,noctalia msg settings-toggle

# 应用启动
bind=SUPER,Return,spawn,foot
bind=SUPER,t,spawn,foot
bind=SUPER,slash,spawn,foot --app-id=quickterminal
bind=SUPER,b,spawn,zen-twilight
bind=SUPER+ALT,b,spawn,brave
bind=SUPER,e,spawn,thunar
bind=SUPER+ALT,o,spawn,foot --app-id=opencode -e opencode

# Noctalia 面板与壁纸
bind=SUPER,z,spawn,noctalia msg panel-toggle launcher
bind=SUPER,space,spawn,noctalia msg panel-toggle control-center
bind=SUPER+SHIFT,n,spawn,noctalia msg panel-toggle control-center notifications
bind=SUPER+SHIFT,p,spawn,noctalia msg panel-toggle session
bind=SUPER+ALT,v,spawn,noctalia msg panel-toggle clipboard
bind=SUPER+ALT,w,spawn,noctalia msg panel-toggle wallpaper
bind=SUPER,F10,spawn,noctalia msg wallpaper-random
bind=SUPER+SHIFT,F10,spawn_shell,~/.config/noctalia/scripts/random-anime-wallpaper
bind=ALT,Tab,spawn,noctalia msg window-switcher

# 窗口、总览与布局
bind=SUPER,o,toggleoverview,1
bind=SUPER,g,toggleoverview,1
bind=SUPER,q,killclient,
bind=SUPER,v,togglefloating,
bind=SUPER,c,centerwin,
bind=SUPER,f,togglemaximizescreen,
bind=SUPER+ALT,f,togglefullscreen,
bind=SUPER,r,switch_proportion_preset,
bind=SUPER+ALT,r,switch_layout,
bind=SUPER+SHIFT,r,reload_config,
bind=SUPER+SHIFT,e,quit,
bind=SUPER,Tab,focusstack,next
bind=SUPER+SHIFT,Tab,focusstack,prev
bind=SUPER,minus,setmfact,-0.05
bind=SUPER,equal,setmfact,+0.05

# 焦点：方向键、HJKL 与 Niri 的 W/S 别名。
bind=SUPER,Left,focusdir,left
bind=SUPER,Down,focusdir,down
bind=SUPER,Up,focusdir,up
bind=SUPER,Right,focusdir,right
bind=SUPER,h,focusdir,left
bind=SUPER,j,focusdir,down
bind=SUPER,k,focusdir,up
bind=SUPER,l,focusdir,right
bind=SUPER,w,focusdir,up
bind=SUPER,s,focusdir,down

# 移动/交换：同时提供方向键、HJKL 与 WASD。
bind=SUPER+CTRL,Left,exchange_client,left
bind=SUPER+CTRL,Down,exchange_client,down
bind=SUPER+CTRL,Up,exchange_client,up
bind=SUPER+CTRL,Right,exchange_client,right
bind=SUPER+CTRL,h,exchange_client,left
bind=SUPER+CTRL,j,exchange_client,down
bind=SUPER+CTRL,k,exchange_client,up
bind=SUPER+CTRL,l,exchange_client,right
bind=SUPER+CTRL,a,exchange_client,left
bind=SUPER+CTRL,s,exchange_client,down
bind=SUPER+CTRL,w,exchange_client,up
bind=SUPER+CTRL,d,exchange_client,right

# 相邻 tag 与数字 tag；Mango 只有固定 1–9，因此不伪造 Niri 的工作区 10。
bind=SUPER,u,viewtoleft_have_client,0
bind=SUPER,i,viewtoright_have_client,0
bind=SUPER,Page_Down,viewtoleft_have_client,0
bind=SUPER,Page_Up,viewtoright_have_client,0
bind=SUPER+CTRL,u,tagtoleft,0
bind=SUPER+CTRL,i,tagtoright,0
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0
bind=SUPER+CTRL,1,tag,1,0
bind=SUPER+CTRL,2,tag,2,0
bind=SUPER+CTRL,3,tag,3,0
bind=SUPER+CTRL,4,tag,4,0
bind=SUPER+CTRL,5,tag,5,0
bind=SUPER+CTRL,6,tag,6,0
bind=SUPER+CTRL,7,tag,7,0
bind=SUPER+CTRL,8,tag,8,0
bind=SUPER+CTRL,9,tag,9,0

# 显示器焦点与窗口跨屏。
bind=SUPER+SHIFT,Left,focusmon,left
bind=SUPER+SHIFT,Down,focusmon,down
bind=SUPER+SHIFT,Up,focusmon,up
bind=SUPER+SHIFT,Right,focusmon,right
bind=SUPER+SHIFT,h,focusmon,left
bind=SUPER+SHIFT,j,focusmon,down
bind=SUPER+SHIFT,k,focusmon,up
bind=SUPER+SHIFT,l,focusmon,right
bind=SUPER+CTRL+SHIFT,Left,tagmon,left
bind=SUPER+CTRL+SHIFT,Down,tagmon,down
bind=SUPER+CTRL+SHIFT,Up,tagmon,up
bind=SUPER+CTRL+SHIFT,Right,tagmon,right
bind=SUPER+CTRL+SHIFT,h,tagmon,left
bind=SUPER+CTRL+SHIFT,j,tagmon,down
bind=SUPER+CTRL+SHIFT,k,tagmon,up
bind=SUPER+CTRL+SHIFT,l,tagmon,right

# 锁屏与挂起
bind=SUPER+ALT,l,spawn,noctalia msg session lock
bind=SUPER+ALT,p,spawn,noctalia msg session lock-and-suspend
switchbind=fold,spawn,noctalia msg session lock-and-suspend

# 截图：区域、聚焦窗口、当前显示器，以及区域截图后交给 Satty 标注。
bind=NONE,Print,spawn_shell,noctalia msg screenshot-region && pkill -f -USR1 '[s]creenshot-sound.sh'
bind=SUPER+ALT,a,spawn_shell,noctalia msg screenshot-region && pkill -f -USR1 '[s]creenshot-sound.sh'
bind=CTRL,Print,spawn_shell,~/.config/mango/scripts/screenshot.sh window
bind=SUPER+ALT+CTRL,a,spawn_shell,~/.config/mango/scripts/screenshot.sh window
bind=SHIFT,Print,spawn_shell,~/.config/mango/scripts/screenshot.sh monitor
bind=SUPER+ALT+CTRL+SHIFT,a,spawn_shell,~/.config/mango/scripts/screenshot.sh monitor
bind=SUPER+SHIFT,s,spawn_shell,~/.config/mango/scripts/screenshot.sh annotate

# 音量、亮度与媒体
bind=NONE,XF86AudioRaiseVolume,spawn,noctalia msg volume-up
bind=NONE,XF86AudioLowerVolume,spawn,noctalia msg volume-down
bind=NONE,XF86AudioMute,spawn,noctalia msg volume-mute
bind=NONE,XF86MonBrightnessUp,spawn,noctalia msg brightness-up
bind=NONE,XF86MonBrightnessDown,spawn,noctalia msg brightness-down
bind=NONE,XF86AudioPlay,spawn,noctalia msg media toggle
bind=NONE,XF86AudioPause,spawn,noctalia msg media toggle
bind=NONE,XF86AudioNext,spawn,noctalia msg media next
bind=NONE,XF86AudioPrev,spawn,noctalia msg media previous

# 鼠标、滚轮与触控板
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize
mousebind=SUPER,btn_middle,killclient,
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client
axisbind=SUPER+CTRL,UP,tagtoleft
axisbind=SUPER+CTRL,DOWN,tagtoright
gesturebind=NONE,left,3,focusdir,left
gesturebind=NONE,right,3,focusdir,right
gesturebind=NONE,up,4,toggleoverview,1
gesturebind=NONE,down,4,toggleoverview,1
