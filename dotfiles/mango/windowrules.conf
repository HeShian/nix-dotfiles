# Mango 窗口规则：翻译 Niri 中有可靠等价语义的浮动、尺寸、焦点与透明度策略。

# Noctalia 设置与临时终端固定为居中浮动窗口。
windowrule=isfloating:1,width:1080,height:920,appid:^dev\.noctalia\.Noctalia$
windowrule=isfloating:1,width:0.5,height:600,offsety:-100,appid:^quickterminal$

# WPS 的菜单与工具窗必须浮动且静默打开，否则会被平铺并抢走主窗口焦点。
windowrule=isfloating:1,isopensilent:1,appid:^wps$,title:^wps$
windowrule=isfloating:1,isopensilent:1,appid:^et$,title:^et$
windowrule=isfloating:1,isopensilent:1,appid:^wpp$,title:^wpp$
windowrule=isfloating:1,isopensilent:1,appid:^wpspdf$,title:^wpspdf$
windowrule=isfloating:1,isopensilent:1,appid:^wps$,title:^WPS (文字|表格|演示)$

# 常见工具窗、查看器与对话框。
windowrule=isfloating:1,appid:^(imv|com\.gabm\.satty|blueman-manager|org\.pulseaudio\.pavucontrol|org\.gnome\.FileRoller|gnome-calculator|galculator)$
windowrule=isfloating:1,appid:^xdg-desktop-portal-gtk$
windowrule=isfloating:1,appid:^fcitx$,title:^Fcitx5 Input Window$
windowrule=isfloating:1,title:^(群聊的聊天记录|聊天记录|群相册|重命名|另存为|图片查看器|图片和视频|视频播放器|画中画|Steam 设置|文件操作进度)$
windowrule=isfloating:1,appid:^steam$,title:^(Friends List|好友列表)$
windowrule=width:0.2,appid:^steam$,title:^(Friends List|好友列表)$
windowrule=isfloating:1,appid:^(zen-twilight|brave.*)$,title:^Picture-in-Picture$
windowrule=isfloating:1,appid:^thunar$,title:^文件操作进度$

# 弹出信息与 Steam 通知不应抢走当前输入焦点。
windowrule=isopensilent:1,appid:^QQ$,title:^(资料卡|天气)$
windowrule=isfloating:1,isopensilent:1,offsetx:100,offsety:100,appid:^steam$,title:^notificationtoasts_[0-9]+_desktop$

# 控制面板保持平铺；在 scroller 布局中占半宽。
windowrule=isfloating:0,scroller_proportion:0.5,appid:^(gnome-control-center|pavucontrol|nm-connection-editor)$

# 快捷键速查表使用独立 app-id，避免被当成普通终端平铺。
windowrule=isfloating:1,width:0.75,height:0.65,appid:^mango-hotkey-menu$

# 浏览器、视频和绘图应用不继承全局半透明，避免内容发灰。
windowrule=focused_opacity:1.0,unfocused_opacity:1.0,appid:^(zen|zen-twilight|brave-browser|mpv|celluloid|krita|org\.kde\.krita)$
windowrule=focused_opacity:1.0,unfocused_opacity:1.0,title:^(图片查看器|画中画|图片和视频|视频播放器)$

# Satty 编辑器始终位于普通窗口上方。
windowrule=isoverlay:1,appid:^com\.gabm\.satty$
