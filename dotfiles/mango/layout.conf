# Mango 布局与输入：tile 为稳定默认，可在 tile/scroller/dwindle 间循环。
circle_layout=tile,scroller,dwindle
scroller_structs=20
scroller_default_proportion=0.8
scroller_focus_center=0
scroller_prefer_center=1
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.5,0.8,1.0
new_is_master=1
smartgaps=0
default_mfact=0.55
default_nmaster=1
dwindle_smart_split=0
dwindle_drop_simple_split=1
dwindle_preserve_split=1

enable_hotarea=1
hotarea_size=10
ov_tab_mode=0

xwayland_persistence=1
# 当前 NVIDIA 驱动先关闭显式同步；驱动或 Mango 修复后再移除此兼容项。
syncobj_enable=0
focus_on_activate=1
sloppyfocus=0
warpcursor=1
focus_cross_monitor=0
focus_cross_tag=0
enable_floating_snap=1
snap_distance=24
cursor_size=24
cursor_theme=Bibata-Modern-Classic
drag_tile_to_tile=1
repeat_rate=25
repeat_delay=600
numlockon=1
xkb_rules_layout=us
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_disable_while_typing=1
