# Mango 主配置：仅负责聚合仓库片段与运行时 Noctalia 主题，修改后用 mmsg 热重载。
source=~/.config/mango/environment.conf
source=~/.config/mango/appearance.conf
source=~/.config/mango/layout.conf
source=~/.config/mango/outputs.conf
source=~/.config/mango/windowrules.conf
source=~/.config/mango/binds.conf

# Noctalia 在运行时覆盖配色；Home Manager 首次激活会先创建空文件，避免 Mango 启动失败。
source=~/.config/mango/noctalia.conf

# 脚本只导入会话环境并启动 mango-session.target，后台程序由 systemd 统一收拢。
exec-once=~/.config/mango/autostart.sh
